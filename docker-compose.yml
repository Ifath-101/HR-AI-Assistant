services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peoplesphere-backend
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      - JWT_SECRET=${JWT_SECRET:-peoplesphere-dev-secret-key-change-in-production-2026}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@123}
      - EMPLOYEE_PASSWORD=${EMPLOYEE_PASSWORD:-Employee@123}
      - DATABASE_PATH=/app/data/hr.db
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_data
      - UPLOAD_DIRECTORY=/app/uploads
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
    volumes:
      # Persistent storage: SQLite, ChromaDB vectors, and uploaded PDF documents
      - sqlite_data:/app/data
      - chroma_data:/app/chroma_data
      - uploads_data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: peoplesphere-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
    name: peoplesphere_sqlite_data
  chroma_data:
    name: peoplesphere_chroma_data
  uploads_data:
    name: peoplesphere_uploads_data
